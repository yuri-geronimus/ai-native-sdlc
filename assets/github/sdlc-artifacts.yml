# sdlc-artifacts.yml - deterministic checks of the change artifacts on every PR.
#
# What it does
#   For every change folder the PR touches (changes/<id>/), runs
#     sdlc.py validate <id> --strict     headings, IDs, open concerns, placeholders
#                                        (draft PRs: without --strict, also for drift)
#     sdlc.py trace <id>                 FR/SC ids in spec.md vs plan.md (GAP fails)
#   and for the change the PR implements (PR body line "Change: <id>" or branch
#   "change/<id>") additionally
#     sdlc.py drift <id> --base origin/<base> --strict
#                                        unplanned files, test edits after FIX_MODE_ON
#     sdlc.py status <id> --json         are the required gates approved on the current
#                                        artifact fingerprints? (GATE_CHECK below)
#   Pure Python (stdlib) from the skill. No model, no secrets, no network beyond checkout.
#
# Playbook plays
#   Stage 1-3 artifacts as gates (intent.md, spec.md, plan.md committed as evidence),
#   Stage 4 "If a test fails, fix the code, not the test" (the CI fallback for test
#   protection: drift flags test edits made after fix mode was switched on), and
#   Stage 5 "AI in the PR review loop" (compliance of the diff against plan.md).
#
# Required secrets
#   None. Uses only the read-only GITHUB_TOKEN for checkout.
#
# How to adapt
#   - Make the "sdlc-artifacts" job a required status check in branch protection or a
#     ruleset; that is what turns these checks into a merge gate.
#   - SKILL_DIR: path of the skill in the repo (default .claude/skills/ai-native-sdlc).
#   - REQUIRE_CHANGE_REF: "true" fails PRs that reference no change. Leave "false" if
#     trivial changes (no change folder) go straight to a PR.
#   - GATE_CHECK: "enforce" fails when a required gate of the referenced change is not
#     approved on the current fingerprint; "warn" annotates only; "off" skips. Use
#     "warn" if your gates are PR reviews of changes/<id>/*.md by CODEOWNERS instead of
#     sdlc.py approvals recorded in audit.md. An artifact-only PR (every changed file under
#     changes_dir) is never failed on gates: its own code-owner review is the gate.
#   - changes_dir is read from .claude/sdlc.json (default "changes").
#   - Merge queue: a required check must also report on the merge-group ref, hence the
#     merge_group trigger. That run passes at once; the PR run already checked the same
#     artifacts.
#   - Pin actions to a commit SHA if your policy requires it.

name: SDLC artifacts

on:
  pull_request:
    # "edited" re-runs the check when the PR body gains or changes its "Change: <id>" line.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: sdlc-artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdlc-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read          # checkout and git history; nothing is written
    env:
      SKILL_DIR: .claude/skills/ai-native-sdlc
      REQUIRE_CHANGE_REF: "false"
      GATE_CHECK: "warn"
    steps:
      - name: Merge queue (checked on the PR)
        if: github.event_name == 'merge_group'
        run: echo "Artifacts were checked on the pull_request run; nothing to do for the merge group."

      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          # The PR head, not the merge commit (same tree as claude-review.yml). Full
          # history: drift diffs against the merge base and checks commits after the
          # FIX_MODE_ON commit recorded in audit.md; origin/<base> is still fetched.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the skill is present
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -f "$SKILL_DIR/scripts/sdlc.py" ]; then
            echo "::error::$SKILL_DIR/scripts/sdlc.py not found. Commit the skill or set SKILL_DIR."
            exit 1
          fi
          python3 --version

      - name: Find changes touched and the change this PR implements
        id: find
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          changes_dir=$(python3 - <<'PY'
          import json, os
          cfg = {}
          if os.path.exists(".claude/sdlc.json"):
              with open(".claude/sdlc.json", encoding="utf-8") as fh:
                  cfg = json.load(fh)
          print(str(cfg.get("changes_dir", "changes")).strip("/"))
          PY
          )
          base="origin/$BASE_REF"
          # Ids of change folders touched by the PR that still exist at HEAD.
          touched=$(git diff --name-only "$base...HEAD" -- "$changes_dir/" \
            | awk -F/ -v d="$changes_dir" 'index($0, d "/") == 1 { n = split(d, p, "/"); print $(n + 1) }' \
            | sort -u | while read -r id; do if [ -d "$changes_dir/$id" ]; then echo "$id"; fi; done | tr '\n' ' ')
          # Referenced change: "Change: <id>" in the PR body wins over branch change/<id>.
          ref=$(printf '%s\n' "$PR_BODY" | tr -d '\r' \
            | sed -n 's/^[[:space:]]*[Cc]hange:[[:space:]]*`\{0,1\}\([A-Za-z0-9._-]*\)`\{0,1\}[[:space:]]*$/\1/p' | head -n 1)
          if [ -z "$ref" ]; then
            case "$HEAD_REF" in change/*) ref="${HEAD_REF#change/}" ;; esac
          fi
          case "$ref" in *[!A-Za-z0-9._-]*) echo "::warning::ignoring unsafe change id"; ref="" ;; esac
          # Artifact PR: every changed file is under changes_dir (SKILL.md "Headless runs").
          others=$(git diff --name-only "$base...HEAD" | awk -v d="$changes_dir/" 'index($0, d) != 1' | wc -l | tr -d ' ')
          artifact_pr=false; [ "$others" -eq 0 ] && artifact_pr=true
          {
            echo "changes_dir=$changes_dir"
            echo "base=$base"
            echo "touched=$touched"
            echo "ref=$ref"
            echo "artifact_pr=$artifact_pr"
          } >> "$GITHUB_OUTPUT"
          echo "changes dir: $changes_dir | touched: ${touched:-none} | referenced: ${ref:-none} | artifact PR: $artifact_pr"

      - name: Validate, trace, drift, gates
        if: github.event_name == 'pull_request'
        env:
          CHANGES_DIR: ${{ steps.find.outputs.changes_dir }}
          BASE: ${{ steps.find.outputs.base }}
          TOUCHED: ${{ steps.find.outputs.touched }}
          REF: ${{ steps.find.outputs.ref }}
          ARTIFACT_PR: ${{ steps.find.outputs.artifact_pr }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set +e -uo pipefail   # no -e: collect every result, decide at the end
          sdlc="python3 $SKILL_DIR/scripts/sdlc.py"
          failed=0
          # Draft PRs get draft-time rules; approval-time (--strict) rules apply once ready.
          strict="--strict"; [ "$PR_DRAFT" = "true" ] && strict=""
          summary="$GITHUB_STEP_SUMMARY"
          echo "## SDLC artifact checks" >> "$summary"

          # run <label> <cmd...>: run, log, record failure, keep going.
          run() {
            label="$1"; shift
            echo "::group::$label"
            out=$("$@" 2>&1); code=$?
            printf '%s\n' "$out"
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then mark="pass"; else mark="FAIL (exit $code)"; failed=1
              echo "::error title=$label::$(printf '%s' "$out" | grep -E '^(ERROR|GAP)' | head -n 3 | tr '\n' ' ')"
            fi
            printf '\n### %s: %s\n\n```\n%s\n```\n' "$label" "$mark" "$out" >> "$summary"
          }

          if [ -z "$REF" ] && [ "$REQUIRE_CHANGE_REF" = "true" ]; then
            echo "::error::No change referenced. Add a line 'Change: <id>' to the PR body or use branch change/<id>."
            failed=1
          fi
          if [ -n "$REF" ] && [ ! -d "$CHANGES_DIR/$REF" ]; then
            echo "::error::PR references change '$REF' but $CHANGES_DIR/$REF does not exist."
            failed=1
            REF=""
          fi

          ids=$(printf '%s %s\n' "$TOUCHED" "$REF" | tr ' ' '\n' | sed '/^$/d' | sort -u)
          if [ -z "$ids" ]; then
            echo "No change folders touched or referenced; nothing to check." | tee -a "$summary"
          fi
          for id in $ids; do
            run "validate $id" $sdlc validate "$id" $strict
            if [ -f "$CHANGES_DIR/$id/spec.md" ] && [ -f "$CHANGES_DIR/$id/plan.md" ]; then
              run "trace $id" $sdlc trace "$id"
            fi
          done

          if [ -n "$REF" ]; then
            if [ -f "$CHANGES_DIR/$REF/plan.md" ]; then
              run "drift $REF" $sdlc drift "$REF" --base "$BASE" $strict
            else
              echo "No plan.md for $REF; drift skipped." | tee -a "$summary"
            fi
            if [ "$GATE_CHECK" != "off" ]; then
              status=$($sdlc status "$REF" --json 2>/dev/null)
              stale=$(printf '%s' "$status" | python3 -c '
          import json, sys
          try:
              s = json.load(sys.stdin)
          except ValueError:
              print("status unreadable"); sys.exit(0)
          gates = s.get("gates", {})
          bad = [g for g in s.get("required_gates", []) if not gates.get(g, {}).get("current")]
          print(" ".join(bad))
          print(" ".join(g for g in bad if gates.get(g, {}).get("exists")))')
              here=$(printf '%s\n' "$stale" | sed -n 2p); stale=$(printf '%s\n' "$stale" | sed -n 1p)
              if [ -n "$stale" ]; then
                msg="Change $REF: required gate(s) not approved on the current artifact: $stale. Run sdlc.py present/approve locally, or re-present after edits."
                if [ "$ARTIFACT_PR" = "true" ]; then
                  # Its code-owner review is the gate; the approver mirrors it into audit.md.
                  msg="Change $REF: artifact-only PR, so the code-owner review of this PR is the gate for: ${here:-its artifacts}. After approval, the approver mirrors it into audit.md from an interactive Claude Code session (say: approve <gate> for $REF, PR <url>)."
                  echo "::notice::$msg"
                elif [ "$GATE_CHECK" = "enforce" ]; then echo "::error::$msg"; failed=1; else echo "::warning::$msg"; fi
                printf '\n%s\n' "$msg" >> "$summary"
              else
                printf '\nGates for %s: all required gates current.\n' "$REF" >> "$summary"
              fi
            fi
          fi
          exit "$failed"
