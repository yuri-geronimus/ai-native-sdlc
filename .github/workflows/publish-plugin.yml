# Builds the Claude Code plugin from this repo and force-pushes it to the `plugin` branch,
# which .claude-plugin/marketplace.json points at. Runs when a version tag is pushed.
name: publish-plugin

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the skill version
        run: |
          v=$(python3 - <<'PY'
          import re
          m = re.search(r'^\s+version:\s*"([^"]+)"', open("SKILL.md").read(), re.M)
          print(m.group(1))
          PY
          )
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != SKILL.md version v$v"; exit 1; }
      - name: Package
        run: python3 scripts/sdlc.py package-plugin --out "$RUNNER_TEMP/plugin" --author "Yuri Geronimus"
      - name: Push to the plugin branch
        working-directory: ${{ runner.temp }}/plugin
        run: |
          git init -q -b plugin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Plugin build for $GITHUB_REF_NAME"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" plugin
